
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Championship</title>
<style>
body{margin:0;background:#080808;color:white;font-family:Arial;text-align:center}
header{background:#e10600;padding:22px 8px;font-size:clamp(25px,6vw,45px);font-weight:900;font-style:italic}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:#191919;margin:15px 0;padding:22px 10px;border-left:7px solid var(--c);border-radius:12px}
.medal{font-size:45px}
.place{font-size:14px;font-weight:bold;color:var(--c);margin:8px}
.name{font-size:clamp(25px,7vw,40px);font-weight:900;overflow-wrap:anywhere}
footer{color:#888;margin:25px;font-size:12px}
</style>
</head>
<body>
<header>🏁 F1 CHAMPIONSHIP</header>
<main>
<div class="card" style="--c:#f6c945">
<div class="medal">🥇</div>
<div class="place">1.er LUGAR</div>
<div class="name" id="p1">GANADOR</div>
</div>
<div class="card" style="--c:#d6dbe1">
<div class="medal">🥈</div>
<div class="place">2.º LUGAR</div>
<div class="name" id="p2">PILOTO 2</div>
</div>
<div class="card" style="--c:#d18b55">
<div class="medal">🥉</div>
<div class="place">3.er LUGAR</div>
<div class="name" id="p3">PILOTO 3</div>
</div>
</main>
<footer>LIVE TIMING · RACE WEEKEND</footer>
</body>
</html>
